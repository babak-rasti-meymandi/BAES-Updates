<svg xmlns="http://www.w3.org/2000/svg" width="640" height="220" viewBox="0 0 640 220" role="img" aria-labelledby="title desc">
  <title id="title">Human authority and AI execution</title>
  <desc id="desc">Human intent and authorization set the boundary. AI performs delegated actions within that boundary, while human override remains available.</desc>
  <rect width="640" height="220" rx="14" fill="#f7f9fc"/>
  <rect x="24" y="28" width="174" height="106" rx="10" fill="#e7eefb" stroke="#5475ad" stroke-width="1.5"/>
  <text x="111" y="57" font-family="Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1f3558">Human</text>
  <text x="111" y="79" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" fill="#1f3558">Intent</text>
  <text x="111" y="98" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" fill="#1f3558">Authorization</text>
  <path d="M204 81 H244" stroke="#52657d" stroke-width="2.5" fill="none"/>
  <path d="M237 74 L245 81 L237 88" stroke="#52657d" stroke-width="2.5" fill="none"/>
  <rect x="252" y="28" width="174" height="106" rx="10" fill="#e6f4ed" stroke="#4c9270" stroke-width="1.5"/>
  <text x="339" y="57" font-family="Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#20553b">AI system</text>
  <text x="339" y="80" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" fill="#20553b">Reasoning</text>
  <text x="339" y="99" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" fill="#20553b">Delegated action</text>
  <path d="M432 81 H472" stroke="#52657d" stroke-width="2.5" fill="none"/>
  <path d="M465 74 L473 81 L465 88" stroke="#52657d" stroke-width="2.5" fill="none"/>
  <rect x="480" y="28" width="136" height="106" rx="10" fill="#fff1df" stroke="#c58a36" stroke-width="1.5"/>
  <text x="548" y="61" font-family="Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#744716">Evidence</text>
  <text x="548" y="82" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" fill="#744716">and review</text>
  <rect x="164" y="157" width="312" height="38" rx="19" fill="#ffffff" stroke="#8b667d" stroke-width="1.5"/>
  <text x="320" y="181" font-family="Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#67445b">Human override remains available</text>
</svg>